<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form 태그</title>
  </head>
  <body>
    <form>
      <!-- 글자입력 -->
      <input type="text" placeholder="아이디" />
      <!-- 비밀번호 입력 -->
      <input type="password" placeholder="비밀번호" />
      <!-- 이메일 -->
       <!-- name:데이터를 전송할떄 사용하는 이름 -->
      <input type="email" placeholder="E-mail" name="email" />
      <!-- 전화번호 -->
      <input type="tel" placeholder="000-0000-0000" />
      <!-- 숫자 -->
      <input type="number" min="1" max="10" />
      <!--인터넷 주소 입력  -->
      <input type="url" placeholder="https://example.com" />
      <!-- 검색 입력 -->
      <input type="search" placeholder="search" />
      <!-- 체크박스(네모:여러개 선택가능) -->
      <input type="checkbox" />
      <input type="checkbox" />
      <input type="checkbox" />
      <!-- 체크박스(동그라미:하나만 선택가능) -->
      <input type="radio" name="gender" />
      <input type="radio" name="gender" />
      <input type="radio" name="gender" />
      <!-- 파일 선택 -->
      <input type="file" />
      <!-- 버튼(active 없음) -->
      <input type="button" value="로그인" />
      <button type="submit">제출</button>
      <!-- 사진모양의 버튼 -->
      <input type="image" src="images/google.png" />
      <!-- 화면에 안보이지만 몰래 값을 저장하는 칸 -->
      <input type="hidden" />
      <!-- 날짜 선택 -->
      <input type="date" />
      <!-- 날짜와 시간 선택 -->
      <input type="datetime-local" />
      <!-- 연도와 월 선택 -->
      <input type="month" />
      <!-- 주 선택 -->
      <input type="week">
      <!-- 시간선택 -->
       <input type="time">
       <!-- 막대를 움직여서 값선택 -->
        <input type="range">
        <!-- 색 선택 -->
         <input type="color">
         <!-- 글쓰기 -->
          <textarea></textarea>
    </form>
  </body>
</html>
